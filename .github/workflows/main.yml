
name: Java CI con Ant

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download Servlet API
      run: |
        mkdir -p lib
        curl -sL "https://tinyurl.com" -o lib/servlet-api.jar

    - name: Build with Java Compiler
      run: |
        mkdir -p bin
        find src -name "*.java" > sources.txt
        javac -d bin -cp "lib/*" @sources.txt


